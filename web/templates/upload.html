<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload GPS — UFCD 5425</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-6 text-gray-100 font-sans">
    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-white">⚽ GPS Load Monitoring</h1>
            <p class="text-xs text-blue-400 font-semibold tracking-wider uppercase">UFCD 5425 — Sistema de Análise de Carga</p>
        </div>

        {% if msg %}
        <div class="bg-amber-500/20 border border-amber-500/50 text-amber-300 p-3 rounded-xl text-xs text-center font-medium">
            {{ msg }}
        </div>
        {% endif %}

        <form action="/upload" method="post" enctype="multipart/form-data" class="space-y-4">
            <div class="border-2 border-dashed border-slate-600 hover:border-blue-500 rounded-xl p-6 text-center transition cursor-pointer bg-slate-900/50">
                <input type="file" name="file" accept=".csv" required class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                <p class="text-xs text-slate-500 mt-3">Submete o ficheiro CSV bruto da sessão de treino</p>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition text-sm">
                🚀 Processar & Gerar Dashboard
            </button>
        </form>
    </div>
</body>
</html>
