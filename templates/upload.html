<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Dados GPS - GPS Load Monitoring</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #334155;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h2 { margin-top: 0; color: #f8fafc; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        input[type="file"] { margin: 20px 0; width: 100%; color: #94a3b8; }
        button {
            background-color: #0072B2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #005a8d; }
        .erro { background-color: #7f1d1d; color: #fca5a5; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Processador Universal de GPS</h2>
        <p>Submeta o ficheiro CSV exportado de qualquer plataforma (STATSports, Catapult, GPExe, Oliver, Wimu, etc.).</p>
        
        {% if erro %}
        <div class="erro">{{ erro }}</div>
        {% endif %}

        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".csv" required>
            <button type="submit">Processar e Gerar Métricas</button>
        </form>
    </div>
</body>
</html>
